<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Sistemas — ZyTerra</title>

  <style>

    :root {
      --zy-blue: #163b63;
      --zy-blue-dark: #0f2f4d;
      --zy-green: #3f7d4a;
      --bg: #eef4fb;
      --white: #ffffff;
      --border: #dce6f0;
      --text: #243447;
      --muted: #66798c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .main {
      margin-left: 240px;
      padding: 35px;
      min-height: 100vh;
    }

    /* CABEÇALHO */

    .page-header {
      margin-bottom: 25px;
    }

    .page-header h1 {
      margin: 0;
      color: var(--zy-blue);
      font-size: 29px;
      font-weight: 700;
    }

    .page-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* CONTROLES */

    .toolbar {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .category-title {
      color: var(--zy-blue);
      font-size: 20px;
      font-weight: 700;
    }

    .category-title span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search {
      width: 260px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .search:focus {
      border-color: var(--zy-blue);
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--zy-blue);
      color: white;
    }

    .btn-primary:hover {
      background: var(--zy-blue-dark);
    }

    .btn-secondary {
      background: white;
      color: var(--zy-blue);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--zy-blue);
    }

    /* INFORMAÇÃO */

    .info {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* GRID */

    .system-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }

    /* CARD */

    .system-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;

      min-height: 180px;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .system-card:hover {
      transform: translateY(-3px);
      border-color: #b7c9dc;
      box-shadow:
        0 10px 25px rgba(22, 59, 99, 0.10);
    }

    .system-category {
      display: inline-block;
      background: #edf4fb;
      color: var(--zy-blue);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .system-title {
      color: var(--zy-blue);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .system-description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      min-height: 42px;
    }

    .card-footer {
      margin-top: 18px;
    }

    /* VAZIO */

    .empty {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .search {
        width: 100%;
      }

      .actions {
        width: 100%;
      }

      .actions .search {
        flex: 1;
      }

    }

  </style>

</head>

<body>

<div class="main">

  <!-- CABEÇALHO -->

  <div class="page-header">

    <h1>Animais</h1>

    <p>
      Sistemas de produção e manejo pecuário do ZyTerra.
    </p>

  </div>


  <!-- BARRA DE CONTROLE -->

  <div class="toolbar">

    <div class="category-title">

      <div id="category-name">
        Sistemas de Produção
      </div>

      <span id="category-description">
        Selecione um sistema para visualizar os detalhes.
      </span>

    </div>


    <div class="actions">

      <input
        type="text"
        id="search"
        class="search"
        placeholder="Pesquisar sistema..."
      >

      <button
        class="btn btn-primary"
        onclick="aplicarBusca()"
      >
        Pesquisar
      </button>

      <a
        href="/animais"
        class="btn btn-secondary"
      >
        Voltar
      </a>

    </div>

  </div>


  <!-- CONTADOR -->

  <div
    id="info"
    class="info"
  ></div>


  <!-- LISTA -->

  <div
    id="system-grid"
    class="system-grid"
  ></div>

</div>


<script>

/* =========================================================
   BANCO DE SISTEMAS
   ========================================================= */

const systemsDB = {

  "bovinos-corte": [

    {
      id: "conf_confinamento",

      title: "Bovinos de Corte — Confinamento",

      desc:
        "Sistema de terminação em confinamento, com dieta concentrada, controle de consumo e acompanhamento de desempenho.",

      slug: "bovinos-corte-confinamento"
    },

    {
      id: "recria_engorda",

      title: "Bovinos de Corte — Recria / Engorda",

      desc:
        "Sistema de recria e engorda utilizando pastagem, suplementação e estratégias de terminação.",

      slug: "bovinos-corte-recria"
    }

  ],


  "bovinos-leite": [

    {
      id: "leite_pasto",

      title: "Bovinos de Leite — Pastoreio",

      desc:
        "Sistema baseado em pastagem, manejo rotacionado e suplementação conforme a necessidade do rebanho.",

      slug: "bovinos-leite-pasto"
    },

    {
      id: "leite_intensivo",

      title: "Bovinos de Leite — Intensivo",

      desc:
        "Sistema de alta produção, com dieta balanceada, manejo nutricional e acompanhamento da produção.",

      slug: "bovinos-leite-intensivo"
    }

  ],


  "suinos": [

    {
      id: "suinos_terminacao",

      title: "Suínos — Creche / Terminação",

      desc:
        "Sistema dividido por fases, com controle de alimentação, crescimento, sanidade e conversão alimentar.",

      slug: "suinos-terminacao"
    }

  ],


  "aves": [

    {
      id: "aves_corte",

      title: "Aves — Frango de Corte",

      desc:
        "Produção de frangos de corte com ciclos definidos, controle de ambiência, nutrição e sanidade.",

      slug: "aves-corte"
    },

    {
      id: "aves_poedeiras",

      title: "Aves — Poedeiras",

      desc:
        "Sistema de produção de ovos com foco em alimentação, manejo, sanidade e desempenho produtivo.",

      slug: "aves-poedeiras"
    }

  ],


  "ovinos": [

    {
      id: "ovinos_pasto",

      title: "Ovinos — Pasto / Recria",

      desc:
        "Sistemas de criação em pastagem, recria e suplementação conforme o objetivo produtivo.",

      slug: "ovinos-pasto"
    }

  ],


  "caprinos": [

    {
      id: "caprinos_leite",

      title: "Caprinos — Leite",

      desc:
        "Sistema de produção de caprinos leiteiros, com foco em nutrição, manejo e produção.",

      slug: "caprinos-leite"
    }

  ],


  "equinos": [

    {
      id: "equinos_geral",

      title: "Equinos — Trabalho / Desporto",

      desc:
        "Manejo nutricional e produtivo de equinos utilizados para trabalho, esporte e outras atividades.",

      slug: "equinos-geral"
    }

  ],


  "coelhos": [

    {
      id: "coelhos_basico",

      title: "Coelhos — Produção",

      desc:
        "Sistema de criação de coelhos para produção, reprodução e manejo básico.",

      slug: "coelhos-basico"
    }

  ]

};


/* =========================================================
   CATEGORIAS
   ========================================================= */

const categoryNames = {

  "bovinos-corte":
    "Bovinos de Corte",

  "bovinos-leite":
    "Bovinos de Leite",

  "suinos":
    "Suínos",

  "aves":
    "Aves",

  "ovinos":
    "Ovinos",

  "caprinos":
    "Caprinos",

  "equinos":
    "Equinos",

  "coelhos":
    "Coelhos"

};


/* =========================================================
   DESCRIÇÕES
   ========================================================= */

const categoryDescriptions = {

  "bovinos-corte":
    "Sistemas de produção de bovinos destinados à produção de carne.",

  "bovinos-leite":
    "Sistemas de produção destinados à produção de leite.",

  "suinos":
    "Sistemas de produção e terminação de suínos.",

  "aves":
    "Sistemas de produção de aves de corte e postura.",

  "ovinos":
    "Sistemas de criação e recria de ovinos.",

  "caprinos":
    "Sistemas de criação e produção de caprinos.",

  "equinos":
    "Sistemas de manejo de equinos.",

  "coelhos":
    "Sistemas de criação e produção de coelhos."

};


/* =========================================================
   PARÂMETROS DA URL
   ========================================================= */

function obterParametros() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return {

    tipo:
      params.get("tipo") || "",

    busca:
      params.get("search") || ""

  };

}


/* =========================================================
   OBTER TODOS OS SISTEMAS
   ========================================================= */

function obterTodosOsSistemas() {

  const todos = [];

  Object.keys(systemsDB).forEach(categoria => {

    systemsDB[categoria].forEach(sistema => {

      todos.push({

        ...sistema,

        categoria: categoria

      });

    });

  });

  return todos;

}


/* =========================================================
   RENDERIZAR
   ========================================================= */

function renderizar() {

  const params =
    obterParametros();

  const tipo =
    params.tipo;

  const busca =
    params.busca
      .toLowerCase()
      .trim();


  let lista = [];


  /*
   * Se existe uma categoria na URL,
   * mostra somente aquela categoria.
   *
   * Se não existe categoria,
   * mostra TODOS os sistemas.
   */

  if (tipo && systemsDB[tipo]) {

    lista =
      systemsDB[tipo].map(sistema => ({

        ...sistema,

        categoria: tipo

      }));

  } else {

    lista =
      obterTodosOsSistemas();

  }


  /*
   * Filtro de pesquisa
   */

  if (busca) {

    lista =
      lista.filter(sistema => {

        const texto = (

          sistema.title +
          " " +
          sistema.desc +
          " " +
          categoryNames[sistema.categoria]

        ).toLowerCase();

        return texto.includes(busca);

      });

  }


  /*
   * Cabeçalho
   */

  const categoryName =
    tipo && categoryNames[tipo]
      ? categoryNames[tipo]
      : "Todos os Sistemas";


  const categoryDescription =
    tipo && categoryDescriptions[tipo]
      ? categoryDescriptions[tipo]
      : "Todos os sistemas de produção disponíveis na Pecuária.";


  document.getElementById(
    "category-name"
  ).textContent =
    categoryName;


  document.getElementById(
    "category-description"
  ).textContent =
    categoryDescription;


  /*
   * Contador
   */

  document.getElementById(
    "info"
  ).textContent =
    lista.length === 1
      ? "1 sistema encontrado."
      : `${lista.length} sistemas encontrados.`;


  /*
   * Grid
   */

  const grid =
    document.getElementById(
      "system-grid"
    );


  grid.innerHTML = "";


  /*
   * Nenhum resultado
   */

  if (lista.length === 0) {

    grid.innerHTML = `

      <div class="empty">

        Nenhum sistema encontrado.

        <br><br>

        Tente outro termo de pesquisa.

      </div>

    `;

    return;

  }


  /*
   * Criar cartões
   */

  lista.forEach(sistema => {

    const card =
      document.createElement("div");

    card.className =
      "system-card";


    card.innerHTML = `

      <div class="system-category">

        ${categoryNames[sistema.categoria]}

      </div>


      <div class="system-title">

        ${sistema.title}

      </div>


      <div class="system-description">

        ${sistema.desc}

      </div>


      <div class="card-footer">

        <button
          class="btn btn-primary"
          onclick="abrirSistema('${sistema.slug}')"
        >
          Abrir sistema
        </button>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* =========================================================
   ABRIR DETALHE
   ========================================================= */

function abrirSistema(slug) {

  window.location.href =
    "/animal-detalhe?nome=" +
    encodeURIComponent(slug);

}


/* =========================================================
   PESQUISA
   ========================================================= */

function aplicarBusca() {

  const params =
    obterParametros();

  const busca =
    document.getElementById(
      "search"
    ).value.trim();


  let url =
    "/animal-lista";


  const query = [];


  if (params.tipo) {

    query.push(
      "tipo=" +
      encodeURIComponent(
        params.tipo
      )
    );

  }


  if (busca) {

    query.push(
      "search=" +
      encodeURIComponent(
        busca
      )
    );

  }


  if (query.length) {

    url +=
      "?" +
      query.join("&");

  }


  window.location.href =
    url;

}


/* =========================================================
   ENTER NA PESQUISA
   ========================================================= */

document
  .getElementById("search")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        aplicarBusca();

      }

    }
  );


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

const parametros =
  obterParametros();


document.getElementById(
  "search"
).value =
  parametros.busca;


renderizar();

</script>


</body>
</html>
