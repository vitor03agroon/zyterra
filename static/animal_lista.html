<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistemas de Produção — ZyTerra</title>

  <style>
    :root {
      --blue: #163b63;
      --page-bg: #eef4fb;
      --text: #17324d;
      --muted: #60758c;
      --border: #d8e1ea;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 40px 50px;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CABEÇALHO */

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      color: var(--blue);
      font-size: 30px;
    }

    .header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    /* NAVEGAÇÃO */

    .topnav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .topnav a {
      padding: 11px 21px;
      border: 1px solid #cbd7e3;
      border-radius: 24px;
      background: var(--white);
      color: var(--blue);
      text-decoration: none;
      font-size: 15px;
    }

    .topnav a.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    /* CABEÇALHO DA LISTA */

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .list-title {
      margin: 0;
      color: var(--blue);
      font-size: 25px;
    }

    .subinfo {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    /* PESQUISA */

    .search-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-area input {
      width: 280px;
      max-width: 100%;

      padding: 11px 13px;

      border: 1px solid #cbd7e3;
      border-radius: 8px;

      background: white;

      font-size: 14px;
      outline: none;
    }

    .search-area input:focus {
      border-color: var(--blue);
    }

    button {
      border: 0;
      border-radius: 8px;

      padding: 11px 18px;

      background: var(--blue);
      color: white;

      font-size: 14px;
      cursor: pointer;
    }

    .back-button {
      display: inline-flex;
      align-items: center;

      padding: 11px 18px;

      border: 1px solid #cbd7e3;
      border-radius: 8px;

      background: white;
      color: var(--blue);

      text-decoration: none;

      font-size: 14px;
    }

    /* CARDS */

    .system-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .system-card {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: 14px;

      padding: 23px;

      min-height: 190px;

      box-shadow: 0 6px 18px rgba(20, 40, 80, 0.06);

      display: flex;
      flex-direction: column;
    }

    .system-card:hover {
      box-shadow: 0 10px 24px rgba(20, 40, 80, 0.09);
    }

    .system-type {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #edf4fa;
      color: var(--blue);

      font-weight: 700;
      font-size: 18px;

      margin-bottom: 16px;
    }

    .system-title {
      margin: 0 0 8px;

      color: var(--blue);

      font-size: 19px;
      font-weight: 700;
    }

    .system-description {
      margin: 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.55;

      flex: 1;
    }

    .open-button {
      margin-top: 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 10px;

      border-radius: 8px;

      background: var(--blue);
      color: white;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
    }

    .open-button:hover {
      opacity: .92;
    }

    /* VAZIO */

    .empty {
      grid-column: 1 / -1;

      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;

      padding: 35px;

      text-align: center;

      color: var(--muted);
    }

    /* RESPONSIVO */

    @media (max-width: 1000px) {

      .system-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      body {
        padding: 22px 18px 40px;
      }

      .system-grid {
        grid-template-columns: 1fr;
      }

      .search-area {
        width: 100%;
      }

      .search-area input {
        width: 100%;
      }

      .search-area button,
      .back-button {
        flex: 1;
        justify-content: center;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <!-- CABEÇALHO -->

  <header class="header">

    <h1>Sistemas de Produção</h1>

    <p>
      Selecione o sistema de produção para acessar as informações técnicas.
    </p>

  </header>


  <!-- NAVEGAÇÃO -->

  <nav class="topnav">

    <a href="/painel">
      Painel
    </a>

    <a href="/culturas">
      Culturas
    </a>

    <a href="/analises">
      Análises
    </a>

    <a class="active" href="/pecuaria">
      Pecuária
    </a>

  </nav>


  <!-- LISTA -->

  <section>

    <div class="list-header">

      <div>

        <h2
          id="list-title"
          class="list-title"
        >
          Sistemas
        </h2>

        <div
          id="subinfo"
          class="subinfo"
        >
          Carregando sistemas...
        </div>

      </div>


      <div class="search-area">

        <input
          id="q"
          type="text"
          placeholder="Pesquisar sistema..."
        >

        <button
          onclick="applyFilter()"
        >
          Filtrar
        </button>

        <a
          href="/pecuaria"
          class="back-button"
        >
          Voltar
        </a>

      </div>

    </div>


    <div
      id="system-grid"
      class="system-grid"
    ></div>

  </section>

</div>


<script>

/*
  SISTEMAS DE PRODUÇÃO
*/

const systemsDB = {

  "bovinos-corte": [

    {
      id: "conf_confinamento",
      title: "Confinamento",
      desc: "Criação em baias com dieta concentrada, controle nutricional e acompanhamento do desempenho.",
      slug: "bovinos-corte-confinamento"
    },

    {
      id: "recria_engorda",
      title: "Recria / Engorda",
      desc: "Sistemas de recria e engorda utilizando pastagem, suplementação ou estratégias de intensificação.",
      slug: "bovinos-corte-recria"
    }

  ],


  "bovinos-leite": [

    {
      id: "pastoreio",
      title: "Pastoreio rotacionado",
      desc: "Sistema baseado em pastagens manejadas em rotação, com suplementação conforme a necessidade do rebanho.",
      slug: "bovinos-leite-pasto"
    },

    {
      id: "curso_intensivo",
      title: "Sistema intensivo",
      desc: "Produção leiteira intensiva com nutrição balanceada, manejo especializado e ordenha.",
      slug: "bovinos-leite-intensivo"
    }

  ],


  "suinos": [

    {
      id: "creche",
      title: "Creche e terminação",
      desc: "Sistema dividido em fases de produção, com manejo nutricional, sanitário e controle de lotação.",
      slug: "suinos-terminacao"
    }

  ],


  "aves": [

    {
      id: "poedeiras",
      title: "Poedeiras",
      desc: "Sistema voltado à produção de ovos, com controle de alimentação, manejo, ambiente e sanidade.",
      slug: "aves-poedeiras"
    },

    {
      id: "corte",
      title: "Frango de corte",
      desc: "Produção de ciclos curtos com controle de densidade, ambiente, nutrição e sanidade.",
      slug: "aves-corte"
    }

  ],


  "ovinos": [

    {
      id: "ovinos-pasto",
      title: "Pasto e recria",
      desc: "Sistema de criação em pastagem, com manejo do rebanho e estratégias de recria.",
      slug: "ovinos-pasto"
    }

  ],


  "caprinos": [

    {
      id: "caprinos-leite",
      title: "Caprinos leiteiros",
      desc: "Sistema voltado à produção de leite caprino e ao manejo nutricional e produtivo.",
      slug: "caprinos-leite"
    }

  ],


  "equinos": [

    {
      id: "equinos-desporto",
      title: "Equinos de trabalho e desporto",
      desc: "Manejo nutricional, sanitário e operacional de equinos utilizados em trabalho ou atividades esportivas.",
      slug: "equinos-geral"
    }

  ],


  "coelhos": [

    {
      id: "coelhos",
      title: "Coelheira",
      desc: "Sistema de produção intensiva de coelhos, com controle de alimentação, manejo e instalações.",
      slug: "coelhos-basico"
    }

  ]

};


/*
  PARÂMETROS
*/

function getParams() {

  const qs =
    new URLSearchParams(
      window.location.search
    );

  return {

    tipo:
      qs.get("tipo") || "",

    search:
      qs.get("search") || ""

  };

}


/*
  FORMATA NOME DA CATEGORIA
*/

function formatTipo(tipo) {

  if (!tipo) {
    return "Sistemas";
  }

  const nomes = {

    "bovinos-corte":
      "Bovinos de Corte",

    "bovinos-leite":
      "Bovinos de Leite",

    "suinos":
      "Suínos",

    "aves":
      "Aves",

    "ovinos":
      "Ovinos",

    "caprinos":
      "Caprinos",

    "equinos":
      "Equinos",

    "coelhos":
      "Coelhos"

  };

  return nomes[tipo] || tipo;

}


/*
  LETRA DO ÍCONE
*/

function getInitial(title) {

  if (!title) {
    return "A";
  }

  return title
    .charAt(0)
    .toUpperCase();

}


/*
  RENDERIZA
*/

function render() {

  const params = getParams();

  const tipo = params.tipo;

  const search =
    params.search
      .toLowerCase()
      .trim();


  document
    .getElementById("q")
    .value = params.search;


  document
    .getElementById("list-title")
    .textContent = formatTipo(tipo);


  const list =
    systemsDB[tipo] || [];


  const filtered =
    list.filter(system => {

      const text =
        (
          system.title +
          " " +
          system.desc
        ).toLowerCase();

      return (
        !search ||
        text.includes(search)
      );

    });


  const grid =
    document.getElementById(
      "system-grid"
    );


  grid.innerHTML = "";


  if (filtered.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        Nenhum sistema encontrado para esta categoria.
      </div>
    `;

    document
      .getElementById("subinfo")
      .textContent =
      "Nenhum sistema disponível.";

    return;

  }


  filtered.forEach(system => {

    const card =
      document.createElement("article");

    card.className =
      "system-card";


    card.innerHTML = `

      <div class="system-type">
        ${getInitial(system.title)}
      </div>

      <h3 class="system-title">
        ${system.title}
      </h3>

      <p class="system-description">
        ${system.desc}
      </p>

      <a
        class="open-button"
        href="/animal-detalhe?nome=${encodeURIComponent(system.slug)}"
      >
        Abrir sistema
      </a>

    `;


    grid.appendChild(card);

  });


  document
    .getElementById("subinfo")
    .textContent =
    `${filtered.length} sistema(s) disponível(is).`;

}


/*
  FILTRO
*/

function applyFilter() {

  const q =
    document
      .getElementById("q")
      .value
      .trim();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const tipo =
    params.get("tipo") || "";


  let url =
    "/animal-lista";


  const query = [];


  if (tipo) {

    query.push(
      "tipo=" +
      encodeURIComponent(tipo)
    );

  }


  if (q) {

    query.push(
      "search=" +
      encodeURIComponent(q)
    );

  }


  if (query.length) {

    url += "?" + query.join("&");

  }


  window.location.href = url;

}


/*
  INICIALIZA
*/

render();

</script>

</body>
</html>
