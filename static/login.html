<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZyTerra - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            color: #163b63;
            font-size: 38px;
        }

        .logo p {
            margin-top: 8px;
            color: #667085;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #344054;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #163b63;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #163b63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #102d4b;
        }

        .cadastro {
            margin-top: 22px;
            text-align: center;
            color: #667085;
        }

        .cadastro a {
            color: #163b63;
            font-weight: bold;
            text-decoration: none;
        }

        #mensagem {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>ZyTerra</h1>
            <p>Inteligência estratégica rural</p>
        </div>

        <form id="loginForm">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div id="mensagem"></div>

        <div class="cadastro">
            Ainda não possui uma conta?
            <a href="/cadastro">Criar conta</a>
        </div>

    </div>

</div>

<script src="/static/js/auth.js"></script>

</body>
</html>
